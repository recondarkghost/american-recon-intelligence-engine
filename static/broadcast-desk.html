<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>American Recon | Daily Broadcast Desk</title><style>*{box-sizing:border-box}body{margin:0;background:#081522;color:#f0f6fa;font:18px/1.5 Arial,sans-serif}header{padding:20px 5%;background:#102d43;border-bottom:4px solid #d03c48;display:flex;justify-content:space-between;gap:20px}header b{letter-spacing:2px}main{max-width:1400px;margin:auto;padding:30px}a{color:#91ddff}button{font:inherit;background:#15455a;color:#fff;padding:13px 18px;border:1px solid #527f96;border-radius:6px;cursor:pointer}button:hover{background:#246578}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{display:flex;flex-direction:column;align-items:start;text-align:left;padding:25px;min-height:200px;background:#102638;border:1px solid #385d74;border-top:3px solid #55d5bc;border-radius:8px}.card strong{font-size:23px;line-height:1.3;margin:14px 0}.card small{color:#b3cddd}.num{color:#75e4ce;letter-spacing:2px}.status{padding:16px;background:#183b43;border-radius:6px}.muted{color:#adc5d4;font-size:15px}h1{font-size:32px;line-height:1.2}.notes{max-width:950px;background:#1e231b;padding:30px;border:1px solid #69714b;margin-top:25px}.notes p{font-size:25px;line-height:1.6}.notes h2{color:#ecdb9e}.notes .muted{font-size:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:20px}.card strong{font-size:21px}}</style><body><div id="root"></div><script>
(()=>{'use strict';const root=document.getElementById('root'),q=new URLSearchParams(location.hash.slice(1)),notesMode=q.get('notes'),channelName='ar-broadcast-simple-v1';const ch=new BroadcastChannel(channelName);const e=(tag,text,parent,cls)=>{const n=document.createElement(tag);n.textContent=text||'';if(cls)n.className=cls;if(parent)parent.append(n);return n};const safe=v=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};const day=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const header=e('header','',root);e('b','AMERICAN RECON / DAILY BROADCAST DESK',header);const home=e('a','Dashboard',header);home.href='./index.html';const main=e('main','',root);let selected=null,rows=[],notesWin=null,busy=false;
function notes(r){main.replaceChildren();e('div','PRESENTER NOTES — KEEP THIS WINDOW OUT OF YOUR RECORDING',main,'num');if(!r){e('h1','Select a report in your Broadcast Desk',main);return}e('h1',r.title,main);const box=e('section','',main,'notes');e('h2','START HERE',box);e('p','Here is the next story. '+r.source+' reports: '+r.title,box);e('h2','READ THE REPORT',box);e('p','Use the original article for the details. Name the source when discussing its claims. A headline alone does not establish that a claim is true.',box,'muted');e('h2','ASK YOUR VIEWERS',box);const questions={economy:'How could this affect your household or your job?',conflict:'What should America’s priority be in this situation?',unrest:'How should officials respond while protecting people’s rights?',health:'What information would help you understand this health issue?',weather:'Are you affected, and what preparations are you making?',infrastructure:'What would help your community prepare for a disruption?'};e('p',questions[r.topic]||'What do you think about this development, and what questions should reporters ask next?',box);e('h2','CLOSE AND MOVE ON',box);e('p','That is what this source is reporting. We will watch for further confirmed developments. Let’s move to the next report.',box);e('p','Published: '+new Date(r.published_at).toLocaleString()+' • These are presentation prompts, not a researched fact-check or a full script.',box,'muted')}
if(notesMode){notes(null);ch.onmessage=x=>{if(x.data?.type==='selected')notes(x.data.report)};ch.postMessage({type:'ready'});setInterval(()=>ch.postMessage({type:'ready'}),5000);return}
e('h1','Ten stories. Click one. Read and discuss.',main);e('p','Each numbered card opens the publisher’s full report in a separate window. Keep your notes window beside it. Record or share only the article window.',main);const status=e('div','Loading source reports…',main,'status'),bar=e('div','',main,'bar'),open=e('button','Open my talking points',bar),refresh=e('button','Check latest edition',bar),grid=e('div','',main,'grid');e('p','Daily edition: prepared by the first successful GitHub publishing run after 6 PM Eastern. Before then, the list is a fresh headline preview. These are source articles, not independently verified finished briefings.',main,'muted');
ch.onmessage=x=>{if(x.data?.type==='ready'&&selected)ch.postMessage({type:'selected',report:selected})};open.onclick=()=>{if(notesWin&&!notesWin.closed){notesWin.focus();return}notesWin=window.open('./broadcast-desk.html#notes=1','ar-presenter-notes','popup,width=720,height=900');if(!notesWin)status.textContent='Allow pop-ups for this site to open your separate notes window.'};
function draw(){grid.replaceChildren();rows.forEach((r,i)=>{const b=e('button','',grid,'card');e('span','REPORT '+String(i+1).padStart(2,'0'),b,'num');e('strong',r.title,b);e('small',r.source+' • '+new Date(r.published_at).toLocaleString(),b);e('small','CLICK TO OPEN FULL SOURCE REPORT →',b);b.onclick=()=>{selected=r;ch.postMessage({type:'selected',report:r});const w=window.open(safe(r.url),'ar-source-report');if(!w)status.textContent='Allow pop-ups, then select the report again.'}})}
function recent(items){const seen=new Set(),counts={};return items.filter(a=>{const u=safe(a.url),t=Date.parse(a.published_at),k=String(a.title||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!u||!k||seen.has(k)||a.stale||!Number.isFinite(t)||Date.now()-t>86400000||t>Date.now()+300000||(counts[a.source]||0)>=2)return false;seen.add(k);counts[a.source]=(counts[a.source]||0)+1;return true}).slice(0,10)}
async function load(){if(busy)return;busy=true;refresh.disabled=true;try{let d=null;try{const r=await fetch('./broadcast-rundown.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});if(r.ok)d=await r.json()}catch{}if(d?.show_date===day()&&Array.isArray(d.reports)&&d.reports.length&&d.reports.every(r=>safe(r.url)&&r.title&&r.source&&Number.isFinite(Date.parse(r.published_at)))){rows=d.reports.slice(0,10);status.textContent='DAILY EDITION • '+d.show_date+' • '+rows.length+' source reports • Prepared '+new Date(d.prepared_at).toLocaleString()}else{const r=await fetch('./dashboard.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Collection unavailable');const data=await r.json(),t=Date.parse(data.updated_at);if(!Number.isFinite(t)||Date.now()-t>3600000||t>Date.now()+300000)throw Error('Collection is stale');rows=recent((data.intelligence?.articles||[]).sort((a,b)=>Date.parse(b.published_at)-Date.parse(a.published_at)));status.textContent='PREVIEW • '+rows.length+' recent source reports • Today’s 6 PM edition has not been published yet.'}draw()}catch(error){status.textContent='CHECK FAILED: '+error.message+'. Previous displayed articles retained.'}finally{busy=false;refresh.disabled=false}}
refresh.onclick=load;load();setInterval(load,60000);
})();</script></body></html>
