<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>American Recon | Broadcast Desk</title>
<style>
:root{font-family:Arial,sans-serif;color:#eaf2fa;background:#080f19;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{background:#19324b;color:white;border:1px solid #57738a;padding:11px 16px;border-radius:6px;cursor:pointer}button:hover{background:#28516e}button:disabled{opacity:.4;cursor:default}header{padding:20px 28px;border-bottom:1px solid #294058;display:flex;align-items:center;gap:18px;flex-wrap:wrap}header b{letter-spacing:3px}small,.muted{color:#a8bacb;font-size:13px;line-height:1.5}a{color:#87ddff}main{padding:22px;max-width:1600px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.layout{display:grid;grid-template-columns:270px 1fr;gap:24px}nav{display:flex;flex-direction:column;gap:7px}nav button{text-align:left;font-size:14px;line-height:1.4}nav button[aria-current=true]{border-color:#60e5cf;background:#123c40}.panel{background:#101e2d;border:1px solid #294158;border-radius:10px;padding:22px}.editor{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:13px;color:#b7ccdd;margin-bottom:15px}input,textarea{display:block;width:100%;background:#07131f;color:#f5f8ff;border:1px solid #496074;padding:12px;border-radius:5px;margin-top:7px}textarea{min-height:110px;resize:vertical}.note{background:#251f12;border-color:#79623a}h1{font-size:28px;margin:0}h2{font-size:20px}.status{padding:12px 0;min-height:38px;color:#8ce9d6}.warning{color:#ffd28d}.review{display:flex;gap:10px;align-items:start}.review input{width:auto;margin:3px 0}.stage{min-height:100vh;background:#eff3f5;color:#102234;display:flex;flex-direction:column}.stage header{background:#071b2e;color:white;border-bottom:6px solid #c83440;justify-content:space-between}.stage main{width:100%;padding:42px 6vw;flex:1}.stage h1{font-size:clamp(32px,4.5vw,72px);max-width:1300px;line-height:1.1;letter-spacing:-1px;margin:18px 0 30px}.stage h2{font-size:24px;color:#163c57}.stage p,.stage li{font-size:clamp(20px,2vw,31px);line-height:1.45}.stage ul{padding-left:30px}.stage .perspective{border-left:5px solid #567a94;padding-left:20px}.stage footer{padding:16px 6vw;background:#102d46;color:#dce8ef;display:flex;gap:20px;justify-content:space-between}.stage small{color:inherit}.stage a{color:#174a6a}.stage .sources{font-size:17px;display:flex;gap:18px;flex-wrap:wrap}.stage .caution{font-size:19px;color:#644b25}.stage .badge{font-weight:bold;letter-spacing:2px;font-size:15px;color:#31596f}.stage .hold{margin-top:14vh}.stage .hold p{color:#456}.stage .page{max-width:1250px}.stage .page[hidden]{display:none}.kbd{font-family:monospace}.safe{color:#80ead2}@media(max-width:850px){.layout,.editor{grid-template-columns:1fr}nav{max-height:220px;overflow:auto}.stage main{padding:25px}.stage footer{padding:15px}header{padding:16px}}
</style>
<body><div id="app"></div><script>
(()=>{'use strict';
const root=document.getElementById('app'),stageToken=new URLSearchParams(location.hash.slice(1)).get('stage');
const el=(tag,text,parent,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;if(parent)parent.append(n);return n};
const clean=v=>String(v||'').slice(0,6000),url=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
function sourceLines(s){return clean(s).split('\n').map(x=>{const i=x.indexOf('|');return {label:(i<0?'Source':x.slice(0,i)).trim(),url:url(i<0?x.trim():x.slice(i+1).trim())}}).filter(x=>x.url).slice(0,8)}
function bullets(s,p){const u=el('ul','',p);clean(s).split('\n').filter(x=>x.trim()).forEach(x=>el('li',x.trim(),u))}
function audience(s){root.replaceChildren();root.className='stage';const h=el('header','',root);el('b','AMERICAN RECON',h);el('span',s?.date||'BROADCAST',h);const m=el('main','',root);if(!s||s.hold){const box=el('div','',m,'hold');el('div','INDEPENDENT NEWS BRIEFING',box,'badge');el('h1','American Recon Daily Briefing',box);el('p','The next report will appear here.',box)}else{el('div','REPORT '+s.number+' / 10  •  '+s.topic,m,'badge');el('h1',clean(s.title),m);const box=el('section','',m,'page');if(s.page===0){el('h2','What is established',box);bullets(s.facts,box)}else if(s.page===1){el('h2','Statements and perspectives',box);el('p',clean(s.views)||'No additional attributed perspectives included.',box,'perspective')}else{el('h2','What remains unclear',box);el('p',clean(s.unknown)||'No additional uncertainty entered by the presenter.',box,'caution')}const sources=el('div','',m,'sources');for(const a of s.sources||[]){const link=el('a',clean(a.label),sources);link.href=url(a.url);link.target='_blank';link.rel='noopener noreferrer'}el('p','Reporting date: '+clean(s.published||'See linked sources'),m,'caution')}
const f=el('footer','',root);el('span','FACTS • SOURCES • CONTEXT',f);el('small',s?.hold?'Awaiting presenter':s?'Source links shown for review. Commentary is the presenter’s.':'Awaiting presenter',f)}
if(stageToken){audience(null);const ch=new BroadcastChannel('ar-show-'+stageToken);ch.onmessage=e=>{if(e.data?.type==='story')audience(e.data.payload)};ch.postMessage({type:'ready'});setInterval(()=>ch.postMessage({type:'ready'}),5000);return}
const day=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let date=day(),key='ar-rundown-v1-'+date,selected=0,page=0,live=null,channel=null,windowRef=null,drafts=[],available=[];
const empty=()=>({title:'',topic:'U.S. / World',facts:'',views:'',unknown:'',sources:'',published:'',notes:'',approved:false});
try{drafts=JSON.parse(localStorage.getItem(key)||'[]')}catch{}if(!Array.isArray(drafts))drafts=[];drafts=Array.from({length:10},(_,i)=>({...empty(),...drafts[i]}));
function save(){try{localStorage.setItem(key,JSON.stringify(drafts));status.textContent='Saved on this browser • '+date}catch{status.textContent='Browser storage unavailable. Keep this window open; changes are not saved.'}}
el('header','',root);const header=root.firstChild;el('b','AMERICAN RECON / BROADCAST DESK',header);el('small',date+' • Presenter controls',header);const home=el('a','Dashboard',header);home.href='./index.html';const main=el('main','',root);el('h1','Your daily ten-report show',main);el('p','Prepare the rundown here. Open the audience window and share ONLY that window in your streaming software. Sharing your entire desktop exposes these notes.',main,'warning');el('p','Presenter notes stay in this browser. This is a public static website: separate windows prevent notes appearing in the audience view; they do not provide account-based access control.',main,'muted');
const tools=el('div','',main,'toolbar');const open=el('button','Open audience window',tools),load=el('button','Load latest story suggestions',tools),fill=el('button','Fill empty slots from suggestions',tools),hold=el('button','Show holding screen',tools);const status=el('div','Ready. Review each story before putting it on air.',main,'status');const layout=el('div','',main,'layout'),nav=el('nav','',layout),panel=el('section','',layout,'panel');const selection=el('h2','',panel);const editor=el('div','',panel,'editor'),publicBox=el('div','',editor),privateBox=el('div','',editor,'panel note');el('h2','Audience content',publicBox);el('h2','Presenter only',privateBox);el('p','Never shown in the audience window. Edits save locally.',privateBox,'muted');
const fields={};function field(k,label,parent,multi=true){const l=el('label',label,parent),n=el(multi?'textarea':'input','',l);n.id='field-'+k;fields[k]=n;n.oninput=()=>{drafts[selected][k]=n.value;drafts[selected].approved=false;approve.checked=false;save();drawNav()};return n}
field('title','Headline',publicBox,false);field('topic','Topic',publicBox,false);field('facts','Verified facts • one concise fact per line',publicBox);field('views','Attributed perspectives • name who said what; distinguish claims from evidence',publicBox);field('unknown','What is unknown / disputed / still developing',publicBox);field('sources','Sources • one per line: Publisher | https://source-url',publicBox);field('published','Reporting date / time',publicBox,false);field('notes','Your talking points, opening, questions and transition',privateBox);const suggestions=el('div','',privateBox);el('h2','Read before airing',privateBox);el('p','Check original documents and reporting. Seek relevant perspectives, include responses where available, and give stronger evidence more weight. Two links alone do not verify a story. Do not infer facts from headlines.',privateBox,'muted');const lab=el('label','',panel,'review'),approve=el('input','',lab);approve.type='checkbox';el('span','I reviewed these facts and sources, checked attribution and uncertainty, and this report is ready to air.',lab);approve.onchange=()=>{drafts[selected].approved=approve.checked;save();drawNav()};
const controls=el('div','',panel,'toolbar');const prev=el('button','← Previous report',controls),next=el('button','Next report →',controls),air=el('button','Put reviewed report on air',controls),step=el('button','Next story page',controls);el('p','Story pages: facts → perspectives → uncertainties. Editing a draft does not change what viewers see; put it on air again to send revisions.',panel,'muted');
function drawNav(){nav.replaceChildren();drafts.forEach((d,i)=>{const b=el('button',String(i+1).padStart(2,'0')+' '+(d.approved?'✓ ':'')+(d.title||'Empty report'),nav);b.setAttribute('aria-current',String(i===selected));b.onclick=()=>{selected=i;draw()}})}
function draw(){drawNav();selection.textContent='Report '+(selected+1)+' of 10';for(const [k,n]of Object.entries(fields))n.value=drafts[selected][k]||'';approve.checked=!!drafts[selected].approved;prev.disabled=selected===0;next.disabled=selected===9;suggestions.replaceChildren();el('h2','Suggested presenter flow',suggestions);['Open: “Here is what the available evidence says.”','Identify the original source and reporting date.','Explain the verified facts in plain language.','Attribute responses and competing explanations.','Separate your analysis from established facts.','Close with what remains unknown and what to watch next.'].forEach(x=>el('p',x,suggestions,'muted'))}
function send(){if(channel&&live)channel.postMessage({type:'story',payload:live})}
open.onclick=()=>{if(windowRef&&!windowRef.closed){windowRef.focus();return}if(!channel){const token=crypto.randomUUID();channel=new BroadcastChannel('ar-show-'+token);channel.token=token;channel.onmessage=e=>{if(e.data?.type==='ready')send()}}windowRef=window.open('./broadcast-desk.html#stage='+channel.token,'ar-audience','popup,width=1280,height=720');if(!windowRef){status.textContent='Allow pop-ups for this site, then click Open audience window again.';return}if(!live)live={hold:true,date};status.textContent='Audience window opened. Share that WINDOW only; do a recording test before going live.'};
hold.onclick=()=>{live={hold:true,date};send();status.textContent='Holding screen sent to audience.'};prev.onclick=()=>{selected=Math.max(0,selected-1);draw()};next.onclick=()=>{selected=Math.min(9,selected+1);draw()};
air.onclick=()=>{const d=drafts[selected],sources=sourceLines(d.sources),domains=new Set(sources.map(s=>new URL(s.url).hostname.replace(/^www\./,'')));if(!d.approved||!d.title.trim()||!d.facts.trim()||!d.unknown.trim()||domains.size<2){status.textContent='Before airing: enter headline, verified facts, uncertainty, links from at least two domains, and check the review box.';return}if(!windowRef||windowRef.closed){status.textContent='Open the audience window first.';return}page=0;live={date,number:selected+1,topic:clean(d.topic),title:clean(d.title),facts:clean(d.facts),views:clean(d.views),unknown:clean(d.unknown),published:clean(d.published),sources,page};send();status.textContent='ON AIR • Report '+(selected+1)+' • Facts page. Notes were not sent.'};step.onclick=()=>{if(!live||live.hold)return;page=(page+1)%3;live.page=page;send();status.textContent='ON AIR • '+['Facts','Perspectives','Uncertainties'][page]};
async function collect(){load.disabled=true;status.textContent='Checking the latest published collection…';try{let r=await fetch('./dashboard.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Collection HTTP '+r.status);const data=await r.json(),stamp=Date.parse(data.updated_at);if(!Number.isFinite(stamp)||Date.now()-stamp>3600000||stamp>Date.now()+300000)throw Error('Collection is stale or timestamp invalid');const seen=new Set();available=(data.intelligence?.articles||[]).filter(a=>{const t=Date.parse(a.published_at),u=url(a.url),k=clean(a.title).toLowerCase().replace(/[^a-z0-9]/g,'');if(a.stale||!u||!k||seen.has(k)||!Number.isFinite(t)||Date.now()-t>86400000||t>Date.now()+300000)return false;seen.add(k);return true}).sort((a,b)=>Date.parse(b.published_at)-Date.parse(a.published_at));status.textContent=available.length+' recent headline suggestions • collection '+new Date(stamp).toLocaleString()+'. Suggestions are unverified drafts, not completed reports.'}catch(e){available=[];status.textContent='Could not load fresh suggestions: '+e.message+'. Saved rundown retained.'}finally{load.disabled=false}}
load.onclick=collect;fill.onclick=()=>{if(!available.length){status.textContent='Load fresh suggestions first. Empty slots stay empty when reporting is insufficient.';return}let added=0;const counts={},used=new Set(drafts.filter(d=>d.title).map(d=>d.title.toLowerCase()));for(const a of available){const slot=drafts.findIndex(d=>!d.title.trim());if(slot<0)break;const source=a.source||new URL(a.url).hostname,topic=a.topics?.[0]||'General';if((counts[source]||0)>=2||used.has(a.title.toLowerCase()))continue;const words=new Set(a.title.toLowerCase().match(/[a-z]{4,}/g)||[]);if(drafts.some(d=>{const w=new Set(d.title.toLowerCase().match(/[a-z]{4,}/g)||[]);return w.size&&[...words].filter(x=>w.has(x)).length/Math.max(words.size,w.size)>.65}))continue;drafts[slot]={...empty(),title:a.title,topic,sources:source+' | '+a.url,published:a.published_at,notes:'DRAFT — verify the full report before airing.\nOpening: '+source+' reports: '+a.title+'\nFind the primary document and independent corroboration.\nWho is affected? What is the response?\nWhat evidence supports each claim? What is still unknown?\nTransition: Explain why the next report matters.'};used.add(a.title.toLowerCase());counts[source]=(counts[source]||0)+1;added++}save();draw();status.textContent='Added '+added+' draft suggestions. No stories were changed on air. Fill facts, perspectives, uncertainties and sources before review.'};
window.addEventListener('beforeunload',()=>{if(channel){live={hold:true,date};send()}});draw();collect().then(()=>{if(drafts.some(d=>!d.title.trim()))fill.onclick()});
})();
</script></body></html>
