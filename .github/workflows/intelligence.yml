name: Update Intelligence Engine
on:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'global_sources.py'
      - 'intelligence_upgrade.py'
      - 'static/**'
      - 'publish_online.py'
      - '.github/workflows/intelligence.yml'
  workflow_dispatch:
  schedule:
    */5 * * * *,
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: intelligence-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python publish_online.py
      - name: Preserve forecast ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/ledger.json state/source_cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save dated forecast ledger'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - id: deploy
        uses: actions/deploy-pages@v4
